name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  source-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Scan source and verify exact reviewed upstream examples
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks dir . --redact --exit-code 0 --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
          python tools/check_secret_scan.py "$RUNNER_TEMP/gitleaks.json"

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test audit policy rejection cases
        run: python tools/check_frontend_audit.py --self-test
      - name: Audit production and development dependencies
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frontend-audit"
          # Capture both command results; the gate rejects command/schema errors,
          # every production finding and any finding without an exact exception.
          set +e
          pnpm audit --json > "$RUNNER_TEMP/frontend-audit/all.json" 2> "$RUNNER_TEMP/frontend-audit/all.stderr.log"
          audit_status=$?
          pnpm audit --prod --json > "$RUNNER_TEMP/frontend-audit/production.json" 2> "$RUNNER_TEMP/frontend-audit/production.stderr.log"
          production_status=$?
          set -e
          printf '%s\n' "$audit_status" > "$RUNNER_TEMP/frontend-audit/all.exit-code"
          printf '%s\n' "$production_status" > "$RUNNER_TEMP/frontend-audit/production.exit-code"
          python ../tools/check_frontend_audit.py \
            --audit "$RUNNER_TEMP/frontend-audit/all.json" \
            --production-audit "$RUNNER_TEMP/frontend-audit/production.json" \
            --audit-exit-code "$audit_status" \
            --production-exit-code "$production_status" \
            | tee "$RUNNER_TEMP/frontend-audit/gate.json"
      - name: Preserve complete frontend audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dependency-audit
          path: ${{ runner.temp }}/frontend-audit/
          retention-days: 30
          if-no-files-found: warn
